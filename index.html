<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
    <div class="container">
        <div class="calc">
            <div class="screen"></div>
            <div class="buttons">
                <button class="button add">+</button>
                <button class="button sub">-</button>
                <button class="button multi">x</button>
                <button class="button div">/</button>
                <button class="button num 1">1</button>
                <button class="button num 2">2</button>
                <button class="button num 3">3</button>
                <button class="button num 4">4</button>
                <button class="button num 5">5</button>
                <button class="button num 6">6</button>
                <button class="button num 7">7</button>
                <button class="button num 8">8</button>
                <button class="button num 9">9</button>
                <button class="button num 0">0</button>
                <button class="button del">del</button>
                <button class="button c">c</button>
                <button class="button eq">=</button>    
            </div>
        </div>
    </div>
<body>
    <script src="script.js"></script>
</body>
</html>
